<h3>My Book List</h3>

<hr>
<div class="d-flex justify-content-end mb-3">
  <a routerLink ="/books/manage" class="btn btn-outline-primary">
    <i class="fa-solid fa-plus"></i> &nbsp; Add New Book
  </a>
</div>
<div class="d-flex justify-content-start gap-2 flex-wrap">
  <app-book-card
    [book]="book"
    *ngFor="let book of bookResponse.content"
    [manage]="true"
    (archive)="archiveBook($event)"
    (share)="shareBook($event)"
    (edit)="editBook($event)"
  >{{book.title}} </app-book-card>
</div>



<div class="d-flex justify-content-center mt-3">
  <nav aria-label="Page Navigation Example">
    <ul class="pagination">
      <i class="page-item ">
        <a (click)="goToFirstPage()"
           class="page-link"
           href="javascript:void(0)"
           aria-label="Previous"
           [class.disabled]="page == 0"
        >
          <i class="fa-solid fa-angle-double-left"></i>
        </a>
      </i>

      <i class="page-item" >
        <a
          (click)="goToPreviousPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Previous"
          [class.disabled]="page == 0"

        >
          <i class="fa-solid fa-angle-left"></i>
        </a>
      </i>

      <li
        class="page-item"
        *ngFor="let page of[].constructor(this.bookResponse.totalPages);let pageIndex = index "
      >
        <a
          (click)="goToPage(pageIndex)"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Previous"
          [class.active]="page == pageIndex"

        >
          {{pageIndex+1}}
        </a>
      </li>

      <i class="page-item ">
        <a (click)="goToNextPage()"
           class="page-link"
           href="javascript:void(0)"
           aria-label="NExt"
           [class.disabled]="isLastPage"

        >
          <i class="fa-solid fa-chevron-right"></i>
        </a>
      </i>

      <i class="page-item" >
        <a
          (click)="gotoLastPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Previous"
          [class.disabled]="isLastPage"

        >
          <i class="fa-solid fa-angles-right"></i>
        </a>
      </i>

    </ul>
  </nav>
</div>
