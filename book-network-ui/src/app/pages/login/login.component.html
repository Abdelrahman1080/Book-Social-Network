<div class="container-fluid card login-container">
<h3 class="text-center">login</h3>
  <hr>
  <div class="alert alert-danger" role="alert"  *ngIf="errormsg.length">
    <p *ngFor="let msg of errormsg">{{msg}}</p>

  </div>

  <div class="mb-3">
    <label for="login" class="form-label">Email adress</label>
    <input [(ngModel)]="authenticationRequest.email" type="email" class="form-control" id="login" placeholder="name@example.com">
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input [(ngModel)]="authenticationRequest.password" type="password" class="form-control" id="password" placeholder="password">
  </div>

  <div class="d-flex justify-content-between mb-3">
    <button (click)="login()" type="button" class="btn btn-primary">
      <em class="fas fa-sign-in-alt">&nbsp; Sign in</em>
    </button>
    <div>
      Don't have an account?&nbsp;
      <button (click)="register()" type="button" class="btn btn-primary">
        <em class="fas fa-sign-in-alt">&nbsp; Register</em>
      </button>
    </div>

  </div>


</div>
